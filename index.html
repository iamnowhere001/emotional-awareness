<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f6f5f0">
    <meta name="theme-color" content="#1e2724" media="(prefers-color-scheme: dark)">
    <meta name="description" content="按年龄分级的情绪启蒙小游戏：3-6 岁、6-12 岁、亲子全年龄与成年四档，各 5 座岛 21 站，按「认出感觉 → 换个角度 → 看见彼此 → 安放自己 → 回望自己」五岛展开，附 162 条心理学词典词条（4 组 11 主题，按概念簇分台阶）、自助工具箱与慢变量。不打分、不排名、不收集心情记录。">
    <title>心情闯关岛 · 一起认出心里的天气</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="style.css">
    <!-- CSP 纵深防御：只在 http(s) 下注入。file:// 双击打开是核心红线，
         而 file:// 的 'self' 语义各浏览器不一，静态 meta 可能拦掉本地脚本，
         因此绝不在 file:// 下启用。项目无用户输入拼 HTML、无 eval、无外链，
         这份策略只是第二道防线，不是修补已知漏洞。 -->
    <script>
      if (location.protocol === 'http:' || location.protocol === 'https:') {
        var m = document.createElement('meta');
        m.httpEquiv = 'Content-Security-Policy';
        m.content = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; " +
          "img-src 'self' data:; font-src 'self' data:; connect-src 'self'; " +
          "object-src 'none'; base-uri 'none'; form-action 'none'";
        document.head.appendChild(m);
      }
    </script>
</head>
<body>
    <div id="app">
        <noscript><p style="padding:24px;color:#5d6a66">这个小游戏需要开启 JavaScript 才能玩。它不会联网，也不会上传任何数据。</p></noscript>
        <header id="topbar">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true"></span>
                <div>
                    <h1>心情闯关岛</h1>
                    <p class="brand-sub">一起认出心里的天气</p>
                </div>
            </div>
            <div class="topbar-right">
                <!-- 档位只在这里出现一次：点它换年龄段。页内不再重复同一枚 chip。 -->
                <button class="band-chip" id="topbar-band" data-action="goto-band" aria-label="换年龄段" hidden></button>
                <div class="shell-count" id="shell-count" aria-live="polite">贝壳 0</div>
            </div>
            <div class="progress-wrap" id="progress-wrap" hidden>
                <div class="step-track" id="step-track" role="group" aria-label="各岛进度，点一座岛进它下一处没走过的站"></div>
                <span id="progress-text">已走过 0 站</span>
            </div>
        </header>

        <main id="stage" tabindex="-1"></main>

        <div id="overlay"></div>

        <details id="disclaimer">
            <summary>关于这个小游戏 · 边界与免责</summary>
            <p>这是一个关于情绪的小游戏，<strong>不是心理测评，也不能代替专业帮助</strong>。它不打分、不排名、不收集你的心情记录，也不宣称任何治疗效果。
            呼吸与正念相关的练习只是一般的放松方式：可以睁眼、随时停止；若感到不适，请停下来并寻求专业支持。
            如果有些感受长期让你难受，和信任的人聊聊，或寻求专业人士的帮助。</p>
        </details>

        <!-- 主导航：四件事覆盖全部入口，任何一屏都能一次点到。
             急救从顶栏挪到这里，是因为底栏在每一屏都常驻，比挤在顶栏右侧更近手。
             放在文档最后 + sticky：短页面贴在卡片下沿，长页面滚到哪都吸在视口底。 -->
        <nav id="tabbar" aria-label="主导航">
            <button class="tab" data-action="go-map" data-tab="map">上岛</button>
            <button class="tab tab-help" id="help-entry" data-action="open-help" data-tab="help">现在很难受</button>
            <button class="tab" data-action="open-tools" data-tab="tools">工具</button>
            <button class="tab" data-action="open-mine" data-tab="mine">我的</button>
        </nav>
    </div>

    <!-- 内容：纯数据，顺序敏感；新增岛/题库再加一行即可。
         全部 classic script + defer：保留严格的顺序执行与 window.MI 全局契约，
         同时让下载与 HTML 解析并行，不再阻塞首屏（defer 保序，file:// 下同样生效）。 -->
    <script defer src="content/bands.js"></script>
    <script defer src="content/glossary.js"></script>
    <script defer src="content/levels-kid.js"></script>
    <script defer src="content/levels-kid-island4.js"></script>
    <script defer src="content/levels-kid-island5.js"></script>
    <script defer src="content/levels-adult.js"></script>
    <script defer src="content/levels-adult-island5.js"></script>
    <script defer src="content/bank-kid-1-3.js"></script>
    <script defer src="content/bank-kid-island4.js"></script>
    <script defer src="content/bank-kid-island5.js"></script>
    <script defer src="content/bank-adult-1-3.js"></script>
    <script defer src="content/bank-adult-island4.js"></script>
    <script defer src="content/bank-adult-island5.js"></script>
    <script defer src="content/bank-compose.js"></script>
    <script defer src="content/levels-adult-work.js"></script>
    <script defer src="content/library.js"></script>
    <script defer src="content/meditate.js"></script>
    <script defer src="content/dictionary.js"></script>
    <script defer src="content/selfhelp.js"></script>
    <script defer src="content/slowvars.js"></script>
    <script defer src="content/help.js"></script>
    <!-- 逻辑：按职责拆分，顺序敏感；每块首行注释写着它依赖谁。同样 defer 保序。 -->
    <script defer src="js/core.js"></script>
    <script defer src="js/util.js"></script>
    <script defer src="js/shell.js"></script>
    <script defer src="js/views-main.js"></script>
    <script defer src="js/views-dictionary.js"></script>
    <script defer src="js/views-selfhelp.js"></script>
    <script defer src="js/views-slowvars.js"></script>
    <script defer src="js/views-retreat.js"></script>
    <script defer src="js/views-level.js"></script>
    <script defer src="js/ui.js"></script>
    <script defer src="js/actions-level.js"></script>
    <script defer src="js/actions-library.js"></script>
    <script defer src="js/actions-data.js"></script>
    <script defer src="js/boot.js"></script>
</body>
</html>
